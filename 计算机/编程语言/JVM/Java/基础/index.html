const themeStyle = document.getElementById('theme-style');

// 设置 Cookie
function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
}

// 获取 Cookie
function getCookie(name) {
    return document.cookie.split('; ').reduce((r, v) => {
        const parts = v.split('=');
        return parts[0] === name ? decodeURIComponent(parts[1]) : r;
    }, '');
}

function setTheme(name) {
    if (name === 'dark') {
        themeStyle.setAttribute('href', "/blog/css/apollo-dark.css");
    } else {
        themeStyle.setAttribute('href', "/blog/css/apollo.css");
    }
}

const currentTheme = getCookie('theme');
if (currentTheme) {
    setTheme(currentTheme);
}

if (themeToggleButton && themeStyle) {
    themeToggleButton.addEventListener('click', () => {
        var theme = "";
        if (themeStyle.getAttribute('href').endsWith('apollo-dark.css')) {
            newTheme = "light";
        } else {
            newTheme = "dark";
        }
        setTheme(newTheme);
        setCookie('theme', newTheme, 7); // 设置 Cookie，有效期为 7 天
    });
} else {
    console.error('无法找到主题切换按钮或样式表链接。');
}
